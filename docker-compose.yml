services:
  app:
    build:
      context: .
      args:
        INSTALL_PIPELINE_DEPS: ${INSTALL_PIPELINE_DEPS:-false}
    env_file:
      - .env.example
    environment:
      ARTIFACTS_DIR: /artifacts
      RUNTIME_DIR: /runtime
      LENTA_JOB_EXECUTION_MODE: local
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./runtime:/runtime
      - ./artifacts:/artifacts:ro
    restart: unless-stopped
